<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="web-shell:title-prefix" content="{{TITLE_PREFIX}}" />
    <title>web-shell</title>
  </head>
  <body>
    <div id="app">
      <aside class="sidebar" id="sidebar">
        <header class="sidebar__header">
          <h1>web-shell</h1>
          <div class="sidebar__actions">
            <button id="pin-sidebar" class="sidebar__pin" type="button" aria-pressed="false" title="pin sidebar" aria-label="pin sidebar">
              <i class="bi bi-pin-angle" aria-hidden="true"></i>
            </button>
            <button id="new-session" type="button" title="new session" aria-label="new session">
              <i class="bi bi-plus-lg" aria-hidden="true"></i>
            </button>
          </div>
        </header>
        <ul id="session-list" class="session-list"></ul>
      </aside>
      <div id="backdrop" class="backdrop" aria-hidden="true"></div>
      <main class="terminal-host">
        <header class="terminal-host__header">
          <button id="menu-toggle" class="menu-toggle" type="button" aria-label="toggle sidebar">
            <span></span><span></span><span></span>
          </button>
          <button id="kb-toggle" class="kb-toggle" type="button" aria-pressed="false" aria-label="toggle keyboard" title="toggle keyboard">
            <i class="bi bi-keyboard" aria-hidden="true"></i>
          </button>
        </header>
        <div class="terminal-area">
          <div id="terminal" class="terminal"></div>
          <div id="terminal-overlay" class="terminal-overlay" data-state="hidden" aria-live="polite" hidden>
            <div class="terminal-overlay__panel" role="status">
              <div class="terminal-overlay__title" id="terminal-overlay-title">Disconnected</div>
              <div class="terminal-overlay__message" id="terminal-overlay-message">Reconnecting…</div>
              <button id="terminal-overlay-action" class="terminal-overlay__action" type="button">Retry now</button>
            </div>
          </div>
        </div>
        <virtual-keyboard id="keyboard" class="keyboard" locale="en" hidden></virtual-keyboard>
        <div id="status" class="status" data-state="idle">no session</div>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
